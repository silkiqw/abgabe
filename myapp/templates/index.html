<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetterstationen</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
        }
        .nav-tabs .nav-link {
            color: #333;
            border: none;
            padding: 10px 15px;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            border-bottom: 2px solid #333;
            background-color: transparent;
        }
        .search-results .list-group-item {
            border-left: none;
            border-right: none;
            padding: 15px;
        }
        .search-button {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .search-button:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        .result-item {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .result-item:hover {
            background-color: #f8f9fa;
        }
        .weather-station {
            color: #dc3545;
            font-weight: bold;
            background: none;
            border: none;
            text-align: left;
            padding: 0;
            width: 100%;
            cursor: pointer;
        }
        .search-form-row {
            align-items: flex-end;
        }
        .search-results {
            display: block; /* Changed from none to block */
        }
        .radius-input {
            margin-bottom: 0;
        }
        
        /* Verbesserte Slider-Styles */
        .custom-range-container {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }
        
        .custom-range-track {
            position: absolute;
            width: 100%;
            height: 6px;
            background-color: #e9ecef;
            border-radius: 3px;
        }
        
        .custom-range-fill {
            position: absolute;
            height: 6px;
            background-color: #dc3545;
            border-radius: 3px;
            left: 0;
        }
        
        .custom-range {
            position: relative;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: transparent;
            z-index: 10;
        }
        
        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #dc3545;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        .custom-range::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #dc3545;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        .pagination .page-item.active .page-link {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        
        .pagination .page-link {
            color: #dc3545;
        }
        
        .pagination .page-link:hover {
            color: #a71d2a;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs px-3 border-bottom">
        <li class="nav-item">
            <a class="nav-link active" href="#">DatenInput</a>
        </li>
        <form action="{% url 'back_data' %}" method="post">
            {% csrf_token %}
        <li class="nav-item">
            <button class="nav-link" type="submit">Wetterstationdetails</button>
        </li>
        </form>
    </ul>
        <form action="{% url 'check' %}" method="post" id="searchForm">
            {% csrf_token %}
        <div class="container py-4">
            <!-- Main Content -->
            <div class="row mb-4 align-items-center">
                <div class="col-md-6">
                    <h2 class="mb-0">Dateneingabe</h2>
                </div>
                <div class="col-md-6 text-end">
                    <div class="d-flex justify-content-end align-items-center gap-3">
                        <div class="d-flex align-items-center">
                            <label for="maxRecords" class="me-2 mb-0">Ergebnisse pro Seite:</label>
                            <select name="maxRecords" id="maxRecords" class="form-select form-select-sm" style="width: 80px;">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="5" selected>5</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                        <button type="submit" class="btn search-button text-white" id="searchButton">Wetterstationen suchen</button>
                    </div>
                </div>
            </div>
            
            <!-- Search Form -->
            <div class="row search-form-row mb-4">
                <div class="col-md-2 mb-3">
                    <label for="lat" class="form-label">Breitengrad eingeben</label>
                    <input type="number" step="0.0001" name="lat" class="form-control" id="lat" required value="47.234">
                </div>
                <div class="col-md-2 mb-3">
                    <label for="lon" class="form-label">Längengrad eingeben</label>
                    <input type="number" step="0.0001" name="lon" class="form-control" id="lon" required value="12.234">
                </div>
                <div class="col-md-2 mb-3">
                    <label for="yearFrom" class="form-label">Von (Jahr)</label>
                    <input type="number" min="1973" max="2024" class="form-control" name="yearFrom" id="yearFrom" placeholder="z.B. 2000" value="2000" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label for="yearTo" class="form-label">Bis (Jahr)</label>
                    <input type="number" min="1973" max="2024" class="form-control" name="yearTo" id="yearTo" placeholder="z.B. 2020" value="2020" required>
                </div>
                <div class="col-md-4 mb-3 radius-input">
                    <label for="searchRadius" class="form-label">Suchradius eingeben</label>
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1 me-3">
                            <div class="custom-range-container">
                                <div class="custom-range-track"></div>
                                <div class="custom-range-fill" id="rangeFill" style="width: 100%;"></div>
                                <input type="range" class="custom-range" name="searchRadius" id="searchRadius" min="0" max="100" value="100" oninput="updateValue(this.value)">
                            </div>
                        </div>
                        <div class="slider-value">
                            <span>Suchradius: </span><span id="radiusValue">100</span>km
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Hidden fields for pagination -->
            <input type="hidden" name="dateFrom" id="dateFrom">
            <input type="hidden" name="dateTo" id="dateTo">
            <input type="hidden" name="page" id="currentPage" value="1">
        </form>
        
        <!-- Search Results -->
        <div id="searchResultsContainer" class="search-results">
            <h3 class="mb-3">Suchergebnisse (11 gefunden)</h3>
            <form action="{% url 'result' %}" method="post">
                {% csrf_token %}
                <div>
                    <ul class="list-group" style="list-style-type: none;">
                        <li class="list-group-item result-item">
                            <button class="weather-station" type="submit" name="choice" value="43.1">Wetterstation #43.1</button>
                        </li>
                        <li class="list-group-item result-item">
                            <button class="weather-station" type="submit" name="choice" value="52.3">Wetterstation #52.3</button>
                        </li>
                        <li class="list-group-item result-item">
                            <button class="weather-station" type="submit" name="choice" value="55.7">Wetterstation #55.7</button>
                        </li>
                        <li class="list-group-item result-item">
                            <button class="weather-station" type="submit" name="choice" value="57.9">Wetterstation #57.9</button>
                        </li>
                        <li class="list-group-item result-item">
                            <button class="weather-station" type="submit" name="choice" value="63.1">Wetterstation #63.1</button>
                        </li>
                    </ul>
                </div>
            </form>
            
            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-4">
                <nav aria-label="Suchergebnisse Navigation">
                    <ul class="pagination">
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="changePage(1)" aria-label="Erste">
                                <span aria-hidden="true">&laquo;&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="changePage(Math.max(1, currentPage-1))" aria-label="Vorherige">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        
                        <li class="page-item active">
                            <a class="page-link" href="#" onclick="changePage(1)">1</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="changePage(2)">2</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="changePage(3)">3</a>
                        </li>
                        
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="changePage(Math.min(3, currentPage+1))" aria-label="Nächste">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="#" onclick="changePage(3)" aria-label="Letzte">
                                <span aria-hidden="true">&raquo;&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    </div>

    <script>
        let currentPage = 1;
        
        function updateValue(val) {
            document.getElementById("radiusValue").textContent = val;
            document.getElementById("rangeFill").style.width = val + '%';
        }
        
        function changePage(page) {
            currentPage = page;
            document.getElementById("currentPage").value = page;
            
            // Submit the form when changing page
            // For demo purposes, we'll just simulate different results
            if (page === 1) {
                updateResultsList([
                    { id: "43.1", name: "Wetterstation #43.1" },
                    { id: "52.3", name: "Wetterstation #52.3" },
                    { id: "55.7", name: "Wetterstation #55.7" },
                    { id: "57.9", name: "Wetterstation #57.9" },
                    { id: "63.1", name: "Wetterstation #63.1" }
                ]);
            } else if (page === 2) {
                updateResultsList([
                    { id: "71.8", name: "Wetterstation #71.8" },
                    { id: "77.8", name: "Wetterstation #77.8" },
                    { id: "85.3", name: "Wetterstation #85.3" },
                    { id: "91.6", name: "Wetterstation #91.6" },
                    { id: "92.5", name: "Wetterstation #92.5" }
                ]);
            } else if (page === 3) {
                updateResultsList([
                    { id: "96.3", name: "Wetterstation #96.3" },
                    { id: "96.8", name: "Wetterstation #96.8" }
                ]);
            }
            
            // Update the active page in pagination
            const paginationItems = document.querySelectorAll('.pagination .page-item');
            paginationItems.forEach(item => {
                item.classList.remove('active');
                const link = item.querySelector('.page-link');
                if (link && link.textContent == page) {
                    item.classList.add('active');
                }
            });
            
            return false; // Prevent default behavior
        }
        
        function updateResultsList(results) {
            const listContainer = document.querySelector('.list-group');
            listContainer.innerHTML = '';
            
            results.forEach(result => {
                const listItem = document.createElement('li');
                listItem.className = 'list-group-item result-item';
                listItem.innerHTML = `
                    <button class="weather-station" type="submit" name="choice" value="${result.id}">${result.name}</button>
                `;
                listContainer.appendChild(listItem);
            });
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Update radius value display and fill as slider changes
        const slider = document.getElementById('searchRadius');
        const radiusValue = document.getElementById('radiusValue');
        const rangeFill = document.getElementById('rangeFill');
        
        // Set initial fill
        rangeFill.style.width = slider.value + '%';
        
        slider.addEventListener('input', function() {
            radiusValue.textContent = this.value;
            rangeFill.style.width = this.value + '%';
        });

        function validateYearInputs() {
            const yearFrom = document.getElementById('yearFrom');
            const yearTo = document.getElementById('yearTo');
            
            // Setze min/max-Attribute für die Jahresbereiche
            const minYear = 1973;
            const maxYear = 2024;
            
            // Event-Listener für das Von-Jahr
            yearFrom.addEventListener('change', function() {
                // Prüfe, ob das Jahr innerhalb des erlaubten Bereichs liegt
                if (this.value < minYear) {
                    alert('Das Jahr darf nicht vor 1973 liegen.');
                    this.value = minYear;
                } else if (this.value > maxYear) {
                    alert('Das Jahr darf nicht nach 2024 liegen.');
                    this.value = maxYear;
                }
                
                // Wenn das Bis-Jahr vor dem Von-Jahr liegt, korrigiere es
                if (yearTo.value && parseInt(yearTo.value) < parseInt(this.value)) {
                    alert('Das Bis-Jahr darf nicht vor dem Von-Jahr liegen.');
                    yearTo.value = this.value;
                }
            });
            
            // Event-Listener für das Bis-Jahr
            yearTo.addEventListener('change', function() {
                // Prüfe, ob das Jahr innerhalb des erlaubten Bereichs liegt
                if (this.value < minYear) {
                    alert('Das Jahr darf nicht vor 1973 liegen.');
                    this.value = minYear;
                } else if (this.value > maxYear) {
                    alert('Das Jahr darf nicht nach 2024 liegen.');
                    this.value = maxYear;
                }
                
                // Wenn das Bis-Jahr vor dem Von-Jahr liegt, korrigiere es
                if (yearFrom.value && parseInt(this.value) < parseInt(yearFrom.value)) {
                    alert('Das Bis-Jahr darf nicht vor dem Von-Jahr liegen.');
                    this.value = yearFrom.value;
                }
            });
        }
        
        // Funktion zur Formularvalidierung vor dem Absenden
        function validateForm(event) {
            const yearFrom = document.getElementById('yearFrom');
            const yearTo = document.getElementById('yearTo');
            const dateFrom = document.getElementById('dateFrom');
            const dateTo = document.getElementById('dateTo');
            
            // Prüfe, ob die Jahresfelder ausgefüllt sind
            if (!yearFrom.value || !yearTo.value) {
                alert('Bitte geben Sie sowohl ein Von- als auch ein Bis-Jahr ein.');
                event.preventDefault();
                return false;
            }
            
            // Prüfe, ob die Jahre im gültigen Bereich liegen
            const minYear = 1973;
            const maxYear = 2024;
            
            if (yearFrom.value < minYear || yearFrom.value > maxYear) {
                alert('Das Von-Jahr muss zwischen 1973 und 2024 liegen.');
                event.preventDefault();
                return false;
            }
            
            if (yearTo.value < minYear || yearTo.value > maxYear) {
                alert('Das Bis-Jahr muss zwischen 1973 und 2024 liegen.');
                event.preventDefault();
                return false;
            }
            
            // Prüfe, ob das Bis-Jahr nach dem Von-Jahr liegt
            if (parseInt(yearTo.value) < parseInt(yearFrom.value)) {
                alert('Das Bis-Jahr darf nicht vor dem Von-Jahr liegen.');
                event.preventDefault();
                return false;
            }
            
            // Setze Datumswerte für die Backend-Verarbeitung
            dateFrom.value = yearFrom.value + '-01-01';
            dateTo.value = yearTo.value + '-12-31';
            
            return true;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialisiere die Jahresvalidierung
            validateYearInputs();
            
            const form = document.getElementById('searchForm');
            if (form) {
                form.addEventListener('submit', validateForm);
            }
        });
    </script>
    
</body>
</html>
